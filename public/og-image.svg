<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Decorative line -->
  <line x1="80" y1="315" x2="240" y2="315" stroke="#3F3F46" stroke-width="1"/>
  
  <!-- R logo mark (simplified) -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="70" height="80" rx="8" fill="#FAFAFA"/>
    <text x="35" y="58" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#000000" text-anchor="middle">R</text>
  </g>
  
  <!-- Brand name -->
  <text x="175" y="238" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#FAFAFA" letter-spacing="-0.5">rancang.dev</text>
  
  <!-- Tagline -->
  <text x="175" y="278" font-family="Inter, sans-serif" font-size="18" fill="#A1A1AA" letter-spacing="0">Engineering Your Digital Future</text>
  
  <!-- Bottom accent -->
  <rect x="80" y="440" width="40" height="3" fill="#FAFAFA" opacity="0.3"/>
  <rect x="80" y="450" width="200" height="1" fill="#3F3F46"/>
  
  <!-- Bottom URL -->
  <text x="80" y="490" font-family="Inter, sans-serif" font-size="14" fill="#52525B">rancang.dev</text>
</svg>
